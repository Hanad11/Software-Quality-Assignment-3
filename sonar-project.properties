sonar.projectKey=Hanad11_Software-Quality-Assignment-3
sonar.organization=hanad11
sonar.projectName=Software-Quality-Assignment-3

# Application code (Python, templates, JS, CSS) lives in the repo root
sonar.sources=.
sonar.exclusions=venv/**,test_images/**,**/__pycache__/**,digit_model.h5,test_*.py,conftest.py

# pytest test files
sonar.tests=.
sonar.test.inclusions=test_*.py,conftest.py

# Python settings and reports produced by the workflow
sonar.python.version=3.10
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

sonar.sourceEncoding=UTF-8
