name: SonarQube Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Full history so SonarQube Cloud can work out new code and blame info
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov==6.0.0

      - name: Run tests with coverage
        run: |
          pytest --cov=. --cov-report=xml:coverage.xml --junitxml=test-results.xml -v

      # Run the scan even if a test fails, so the results still reach SonarQube Cloud.
      # The job is still marked as failed when tests fail.
      - name: SonarQube Cloud scan
        if: ${{ !cancelled() }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
